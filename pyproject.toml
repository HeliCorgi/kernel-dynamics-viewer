[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-dynamics-viewer"
version = "1.0.0"
description = "Regime diagnostics for spatiotemporal kernels K(r,t) from non-equilibrium many-body systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "HeliCorgi"}]
keywords = [
    "physics", "computational-physics", "condensed-matter",
    "transport", "anomalous-diffusion", "correlation-functions",
    "structure-factor", "hankel-transform", "regime-classification",
    "time-series", "trajectory-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/HeliCorgi/kernel-dynamics-viewer"
Repository = "https://github.com/HeliCorgi/kernel-dynamics-viewer"
Issues = "https://github.com/HeliCorgi/kernel-dynamics-viewer/issues"

[project.optional-dependencies]
# GUI-only extra. The core install stays numpy + scipy + matplotlib; Streamlit
# is never imported by any core module or the core test suite.
gui = ["streamlit>=1.30"]
# Example-generation extra: yupi is used ONLY by examples/generate_yupi_examples.py
# to synthesise trajectory ensembles. The library (incl. io/trajectories.py) never
# imports yupi, and the core test job does not need it.
examples = ["yupi>=1.0"]

[project.scripts]
kernel-viewer = "kernel_viewer.cli:main"
stateflow = "stateflow.cli:main"

[tool.setuptools.packages.find]
include = ["kernel_viewer*", "stateflow*"]
