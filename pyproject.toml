[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-dynamics-viewer"
version = "0.8.0"
description = "Regime diagnostics for spatiotemporal kernels K(r,t) from non-equilibrium many-body systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
# GUI-only extra. The core install stays numpy + scipy + matplotlib; Streamlit
# is never imported by any core module or the core test suite.
gui = ["streamlit>=1.30"]

[project.scripts]
kernel-viewer = "kernel_viewer.cli:main"
stateflow = "stateflow.cli:main"

[tool.setuptools.packages.find]
include = ["kernel_viewer*", "stateflow*"]
